<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Linha do tempo institucional do PIS/PASEP: 1970, 1988 e 2023">
  <title>PIS PASEP — Linha do tempo institucional</title>
  <desc>Três marcos: 1970 instituição pela LC nº 8, 1988 redirecionamento pela CF/88 artigo 239, e 2023 tema 1.150 do STJ.</desc>

  <!--
    Estratégia de cores (dark/light friendly):
    - Acentos (linha, nós, identificadores legais) -> #A57314 (bronze, fixo)
    - Texto neutro (datas e descricoes) -> currentColor (flipa com o tema)
    - Rotulo superior -> currentColor com opacity 0.55
    - Descricoes -> currentColor com opacity 0.85

    Tipografia:
    - Display (datas, descricoes serifa) -> Cormorant Garamond
    - Body (rotulo e identificadores legais) -> IBM Plex Sans
  -->

  <!-- ROTULO SUPERIOR -->
  <text x="800" y="160"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="22"
        font-weight="300"
        letter-spacing="6"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.55">PIS · PASEP · LINHA DO TEMPO INSTITUCIONAL</text>

  <line x1="770" y1="195" x2="830" y2="195" stroke="#A57314" stroke-width="1.4"/>

  <!-- LINHA DO TEMPO + NOS -->
  <line x1="160" y1="500" x2="1440" y2="500" stroke="#A57314" stroke-width="1.4"/>

  <circle cx="320"  cy="500" r="10" fill="#A57314"/>
  <circle cx="800"  cy="500" r="10" fill="#A57314"/>
  <circle cx="1280" cy="500" r="10" fill="#A57314"/>

  <!-- NO 1 — 1970 -->
  <text x="320" y="380"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="84"
        font-weight="500"
        text-anchor="middle"
        fill="currentColor">1970</text>

  <text x="320" y="430"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="18"
        font-weight="400"
        letter-spacing="4"
        text-anchor="middle"
        fill="#A57314">LC Nº 8</text>

  <text x="320" y="590"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.85">Instituição do PASEP</text>

  <text x="320" y="624"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.85">Depósitos individuais</text>

  <text x="320" y="658"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.85">começam</text>

  <!-- NO 2 — 1988 -->
  <text x="800" y="380"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="84"
        font-weight="500"
        text-anchor="middle"
        fill="currentColor">1988</text>

  <text x="800" y="430"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="18"
        font-weight="400"
        letter-spacing="4"
        text-anchor="middle"
        fill="#A57314">CF/88 · ART. 239</text>

  <text x="800" y="590"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.85">Redirecionamento</text>

  <text x="800" y="624"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.85">Contas individuais</text>

  <text x="800" y="658"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.85">cessam</text>

  <!-- NO 3 — 2023 -->
  <text x="1280" y="380"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="84"
        font-weight="500"
        text-anchor="middle"
        fill="currentColor">2023</text>

  <text x="1280" y="430"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="18"
        font-weight="400"
        letter-spacing="4"
        text-anchor="middle"
        fill="#A57314">STJ · TEMA 1.150</text>

  <text x="1280" y="590"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.85">BB responde</text>

  <text x="1280" y="624"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.85">Prazo decenal</text>

  <text x="1280" y="658"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="currentColor"
        fill-opacity="0.85">da ciência</text>

</svg>
