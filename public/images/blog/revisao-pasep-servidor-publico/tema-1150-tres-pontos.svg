<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Os tres pontos do Tema 1.150 do STJ: legitimidade, prazo e termo inicial.">
  <title>STJ — Tema 1.150 — Tres pontos</title>
  <desc>Card I: Legitimidade, Banco do Brasil responde. Card II: Prazo, dez anos pelo art. 205 do Codigo Civil. Card III: Termo inicial, ciencia comprovada do desfalque.</desc>

  <defs>
    <!-- Textura sutil de papel off-white -->
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.45
                             0 0 0 0 0.38
                             0 0 0 0 0.30
                             0 0 0 0.05 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- FUNDO OFF-WHITE FIXO (papel de revista premium) -->
  <rect x="40" y="40" width="1520" height="920" rx="6" ry="6" fill="#F8F4EC"/>

  <!-- Textura sutil de papel -->
  <rect x="40" y="40" width="1520" height="920" rx="6" ry="6" fill="#F8F4EC" filter="url(#paperGrain)" opacity="0.55"/>

  <!-- Borda externa fina em bronze -->
  <rect x="40" y="40" width="1520" height="920" rx="6" ry="6"
        fill="none" stroke="#A57314" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ROTULO SUPERIOR -->
  <text x="800" y="130"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="22"
        font-weight="300"
        letter-spacing="6"
        text-anchor="middle"
        fill="#6a6a6a">STJ · TEMA 1.150 · TRÊS PONTOS</text>

  <line x1="770" y1="165" x2="830" y2="165" stroke="#A57314" stroke-width="1.4"/>

  <!-- CARD I — LEGITIMIDADE -->
  <rect x="120" y="240" width="420" height="620" rx="4" ry="4"
        fill="none"
        stroke="#A57314"
        stroke-opacity="0.35"
        stroke-width="1"/>

  <text x="330" y="440"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="130"
        font-weight="500"
        text-anchor="middle"
        fill="#A57314">I</text>

  <line x1="300" y1="485" x2="360" y2="485" stroke="#A57314" stroke-width="1.4"/>

  <text x="330" y="595"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="54"
        font-weight="500"
        text-anchor="middle"
        fill="#1A1A1A">Legitimidade</text>

  <text x="330" y="710"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="#1A1A1A">Banco do Brasil</text>

  <text x="330" y="744"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="#1A1A1A">responde</text>

  <!-- CARD II — PRAZO -->
  <rect x="590" y="240" width="420" height="620" rx="4" ry="4"
        fill="none"
        stroke="#A57314"
        stroke-opacity="0.35"
        stroke-width="1"/>

  <text x="800" y="440"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="130"
        font-weight="500"
        text-anchor="middle"
        fill="#A57314">II</text>

  <line x1="770" y1="485" x2="830" y2="485" stroke="#A57314" stroke-width="1.4"/>

  <text x="800" y="595"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="54"
        font-weight="500"
        text-anchor="middle"
        fill="#1A1A1A">Prazo</text>

  <text x="800" y="710"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="#1A1A1A">Dez anos</text>

  <text x="800" y="750"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="18"
        font-weight="500"
        letter-spacing="4"
        text-anchor="middle"
        fill="#A57314">CC · ART. 205</text>

  <!-- CARD III — TERMO INICIAL -->
  <rect x="1060" y="240" width="420" height="620" rx="4" ry="4"
        fill="none"
        stroke="#A57314"
        stroke-opacity="0.35"
        stroke-width="1"/>

  <text x="1270" y="440"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="130"
        font-weight="500"
        text-anchor="middle"
        fill="#A57314">III</text>

  <line x1="1240" y1="485" x2="1300" y2="485" stroke="#A57314" stroke-width="1.4"/>

  <text x="1270" y="595"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="54"
        font-weight="500"
        text-anchor="middle"
        fill="#1A1A1A">Termo inicial</text>

  <text x="1270" y="710"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="#1A1A1A">Ciência comprovada</text>

  <text x="1270" y="744"
        font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-size="24"
        font-weight="400"
        text-anchor="middle"
        fill="#1A1A1A">do desfalque</text>

</svg>
