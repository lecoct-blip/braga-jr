name: Deploy Hostinger (static export)

# Builda o site (Next.js static export → out/) e publica o conteúdo na branch
# `production`, que é o que a Hostinger serve. Para atualizar o site no ar,
# basta dar push na `main` — este workflow cuida do resto.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

permissions:
  contents: write # necessário para o GITHUB_TOKEN empurrar para a branch production

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (next build → static export em ./out)
        run: npm run build

      # O `next build` (static export) NÃO copia dotfiles do public/ de forma
      # confiável entre plataformas → garantimos .htaccess e contato.php no out/.
      - name: Garante .htaccess e contato.php no out/
        run: |
          cp public/.htaccess out/.htaccess
          cp public/contato.php out/contato.php
          test -f out/.htaccess && grep -q Cache-Control out/.htaccess && echo "ok: .htaccess com cache headers"

      # Publish via git puro — peaceiris/actions-gh-pages DESCARTA dotfiles
      # (.htaccess) na publicação. `git add -A` inclui dotfiles, garantindo que
      # .htaccess (redirects + cache) e contato.php cheguem à branch production.
      - name: Publish ./out para a branch production
        run: |
          cd out
          git init -q
          git checkout -q -b production
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${{ github.event.head_commit.message }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" production:production
          echo "Publicado. Conteudo de production:"; git ls-files | grep -E "\.htaccess|contato\.php|^index\.html"
