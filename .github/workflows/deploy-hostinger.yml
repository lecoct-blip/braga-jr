name: Deploy Hostinger (static export)

# Builda o site (Next.js static export → out/) e publica o conteúdo na branch
# `production`, que é o que a Hostinger serve. Para atualizar o site no ar,
# basta dar push na `main` — este workflow cuida do resto.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

permissions:
  contents: write # necessário para o GITHUB_TOKEN empurrar para a branch production

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (next build → static export em ./out)
        run: npm run build

      # O `next build` (static export) NÃO copia dotfiles do public/ de forma
      # confiável entre plataformas → garantimos .htaccess e contato.php no out/.
      - name: Garante .htaccess e contato.php no out/
        run: |
          cp public/.htaccess out/.htaccess
          cp public/contato.php out/contato.php
          test -f out/.htaccess && grep -q Cache-Control out/.htaccess && echo "ok: .htaccess com cache headers"

      # Publish preservando o HISTÓRICO da branch production (clona + commita por
      # cima, sem force-push). Crucial: `git init`/force-push reescreve o histórico
      # e quebra o `git pull` (fast-forward) do deploy da Hostinger. `cp -a out/.`
      # + `git add -A` incluem dotfiles (.htaccess), que o peaceiris descartava.
      - name: Publish ./out para a branch production
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          rm -rf .deploy
          git clone --branch production --single-branch "$REMOTE" .deploy 2>/dev/null \
            || { mkdir .deploy && cd .deploy && git init -q && git checkout -b production && cd ..; }
          find .deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a out/. .deploy/
          cd .deploy
          git add -A
          if git diff --cached --quiet; then
            echo "sem mudanças para publicar"
          else
            git commit -q -m "deploy: ${{ github.event.head_commit.message }}"
            git push -q "$REMOTE" production
          fi
          echo "production atualizada. dotfiles-chave:"; git ls-files | grep -E "\.htaccess|contato\.php" || true
