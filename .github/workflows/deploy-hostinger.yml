name: Deploy Hostinger (static export)

# Builda o site (Next.js static export → out/) e publica o conteúdo na branch
# `production`, que é o que a Hostinger serve. Para atualizar o site no ar,
# basta dar push na `main` — este workflow cuida do resto.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

permissions:
  contents: write # necessário para o GITHUB_TOKEN empurrar para a branch production

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (next build → static export em ./out)
        run: npm run build

      # O `next build` (static export) NÃO copia dotfiles do public/ de forma
      # confiável entre plataformas → garantimos .htaccess e contato.php no out/.
      - name: Garante .htaccess e contato.php no out/
        run: |
          cp public/.htaccess out/.htaccess
          cp public/contato.php out/contato.php
          test -f out/.htaccess && grep -q Cache-Control out/.htaccess && echo "ok: .htaccess com cache headers"

      # Configura a chave SSH efêmera no runner para o rsync. A chave privada
      # vive APENAS no GitHub Secrets (cofre criptografado); aqui é materializada
      # em ~/.ssh/deploy_key com permissão 600 (exigência do OpenSSH). ssh-keyscan
      # captura o host key da Hostinger e adiciona a known_hosts — evita
      # StrictHostKeyChecking=no (que aceitaria qualquer MITM).
      - name: Configurar SSH para Hostinger
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "ok: chave SSH e known_hosts configurados"

      # rsync sincroniza out/ → public_html/ da Hostinger via SSH. Flags:
      #   -a (archive)   preserva permissões, mtimes, simbólicos
      #   -v (verbose)   log do que foi transferido (útil pra debug do Action)
      #   -z (compress)  compressão na transferência (ganho real em HTML/JS)
      #   --delete       remove no servidor o que não existe local → ZERO órfãos
      # Note o trailing slash em `out/` (envia CONTEÚDO, não a pasta) e em
      # ${DEPLOY_PATH}/ (destino do conteúdo). `.htaccess` e contato.php vão
      # juntos porque NÃO estão na lista de exclude.
      - name: Deploy via rsync SSH para Hostinger
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            out/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
          echo "ok: rsync concluido → ${{ secrets.DEPLOY_PATH }}/"

      # Publish para a branch `production` mantida como AUDITORIA HISTÓRICA
      # (não é mais consumida por ninguém — antes era a fonte do Git deployment
      # da Hostinger, que descobrimos ser bugado). Útil pra: rollback via ZIP,
      # diff entre deploys, prova de "o que estava no ar em cada momento".
      # Se quiser remover no futuro, basta apagar este step.
      - name: Audit trail — publish ./out para a branch production
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          rm -rf .deploy
          git clone --branch production --single-branch "$REMOTE" .deploy 2>/dev/null \
            || { mkdir .deploy && cd .deploy && git init -q && git checkout -b production && cd ..; }
          find .deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a out/. .deploy/
          cd .deploy
          git add -A
          if git diff --cached --quiet; then
            echo "production: sem mudanças"
          else
            git commit -q -m "deploy: ${{ github.event.head_commit.message }}"
            git push -q "$REMOTE" production
            echo "production atualizada (audit)"
          fi
