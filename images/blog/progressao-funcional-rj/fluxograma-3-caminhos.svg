<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Sequência vertical em cinco etapas: identificação do bloqueio, requerimento administrativo, recurso hierárquico, canais institucionais e via judicial. Cada etapa intermediária encerra o caso se a progressão for concedida; segue à etapa seguinte se indeferida ou silente.</desc>

